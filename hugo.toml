baseURL = 'http://localhost:1313/'
defaultContentLanguage = 'en'
title = 'latent_shift'

[languages.en]
  locale = 'en-gb'

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = 'Engineering notes, experimentation, and useful rabbit holes.'
  author = 'Gokhan Demirtas'

[mediaTypes]
  ["audio/mp4"]
    suffixes = ["m4a"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[[menus.main]]
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = 'Blog'
  pageRef = '/posts'
  weight = 20

[[module.imports]]
  path="github.com/hugomods/icons/vendors/devicons"

[[module.imports]]
  path="github.com/hugomods/icons/vendors/lucide"
