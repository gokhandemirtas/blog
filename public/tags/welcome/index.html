    <script>
      (() => {
        const saved = localStorage.getItem('ledger-theme');
        const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved || preferred;
      })();
    </script>
  </head>

      <div class="container header-inner">
        <a class="brand" href="/"><span class="brand-mark">▦</span><span>Technical Ledger</span></a>

        </nav>
        <button class="mobile-theme-toggle" type="button" aria-label="Toggle dark mode" data-theme-toggle>◐</button>
      </div>
    </header>

    <section class="archive-heading"><p class="eyebrow">SYSTEM_DIRECTORY / ARCHIVE</p><h1>Welcome</h1></section>

    </footer>
    <script>
      document.querySelectorAll('[data-theme-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = next;
          localStorage.setItem('ledger-theme', next);
          document.querySelectorAll('[data-theme-label]').forEach((label) => label.textContent = next === 'dark' ? 'Light mode' : 'Dark mode');
          document.querySelectorAll('[data-theme-icon]').forEach((icon) => icon.textContent = next === 'dark' ? '☀' : '◐');
        });
      });
    </script>
  </body>
