<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="800"
  height="800"
  viewBox="0 0 200 200">

  <defs>
    <!-- Hexagonal Penrose-style tile pattern -->
    <pattern id="penrose-hex"
             x="0" y="0"
             width="40" height="34.641"
             patternUnits="userSpaceOnUse">
      <!-- Base hexagon -->
      <polygon
        points="20,0 40,10 40,24.641 20,34.641 0,24.641 0,10"
        fill="#111827"
        stroke="#1f2937"
        stroke-width="0.5" />

      <!-- Inner kite shapes (Penrose-like) -->
      <!-- Top kite -->
      <polygon
        points="20,0 30,5 20,10 10,5"
        fill="#f97316"
        stroke="#fbbf24"
        stroke-width="0.4" />

      <!-- Upper-right kite -->
      <polygon
        points="40,10 35,15 30,10 35,5"
        fill="#22c55e"
        stroke="#4ade80"
        stroke-width="0.4" />

      <!-- Lower-right kite -->
      <polygon
        points="40,24.641 35,19.641 30,24.641 35,29.641"
        fill="#3b82f6"
        stroke="#60a5fa"
        stroke-width="0.4" />

      <!-- Bottom kite -->
      <polygon
        points="20,34.641 30,29.641 20,24.641 10,29.641"
        fill="#ec4899"
        stroke="#f472b6"
        stroke-width="0.4" />

      <!-- Lower-left kite -->
      <polygon
        points="0,24.641 5,19.641 10,24.641 5,29.641"
        fill="#a855f7"
        stroke="#c4b5fd"
        stroke-width="0.4" />

      <!-- Upper-left kite -->
      <polygon
        points="0,10 5,15 10,10 5,5"
        fill="#eab308"
        stroke="#fde047"
        stroke-width="0.4" />

      <!-- Central star -->
      <polygon
        points="20,10 27,13.464 27,21.177 20,24.641 13,21.177 13,13.464"
        fill="#0f172a"
        stroke="#e5e7eb"
        stroke-width="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#020617" />

  <!-- Apply repeating hex Penrose-style pattern -->
  <rect x="0" y="0" width="200" height="200" fill="url(#penrose-hex)" />
</svg>
