{{- $title := .Get "title" | default "JSON" -}}
{{- $caption := .Get "caption" -}}
{{- $id := printf "jv-%d" (now.UnixNano) -}}

<details class="json-viewer" id="{{ $id }}">
  <summary class="json-viewer-summary">
    <div class="json-viewer-meta">
      <p class="eyebrow">JSON</p>
      <strong>{{ $title }}</strong>
    </div>
    <span class="json-viewer-toggle" aria-hidden="true">
      <svg class="json-viewer-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </span>
  </summary>
  <div class="json-viewer-body">
    <div id="{{ $id }}-editor" class="json-viewer-monaco"></div>
  </div>
  {{- with $caption }}<p class="json-viewer-caption">{{ . }}</p>{{ end -}}
</details>

{{- /* textarea.value decodes HTML entities automatically — safest way to pass raw text through Hugo */ -}}
<textarea id="{{ $id }}-src" hidden>{{ .Inner | safeHTML }}</textarea>

<script>
(function () {
  var details = document.getElementById("{{ $id }}");
  var done = false;

  details.addEventListener("toggle", function () {
    if (!details.open || done) return;
    done = true;

    var raw = document.getElementById("{{ $id }}-src").value.trim();
    try { raw = JSON.stringify(JSON.parse(raw), null, 2); } catch (e) {}

    var lineCount = raw.split("\n").length;
    var height = Math.min(Math.max(lineCount * 19 + 16, 80), 520);
    var container = document.getElementById("{{ $id }}-editor");
    container.style.height = height + "px";

    function mount() {
      var theme = document.documentElement.getAttribute("data-theme") === "dark" ? "vs-dark" : "vs";
      monaco.editor.create(container, {
        value: raw,
        language: "json",
        readOnly: true,
        theme: theme,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        fontSize: 13,
        lineNumbers: "off",
        folding: true,
        renderLineHighlight: "none",
        overviewRulerLanes: 0,
        hideCursorInOverviewRuler: true,
        scrollbar: { vertical: "auto", horizontal: "auto" },
      });

      document.querySelectorAll("[data-theme-toggle]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTimeout(function () {
            var t = document.documentElement.getAttribute("data-theme") === "dark" ? "vs-dark" : "vs";
            monaco.editor.setTheme(t);
          }, 50);
        });
      });
    }

    if (window.monaco) {
      mount();
    } else {
      window._jvQueue = window._jvQueue || [];
      window._jvQueue.push(mount);
      if (!window._jvLoading) {
        window._jvLoading = true;
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js";
        s.onload = function () {
          require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs" } });
          require(["vs/editor/editor.main"], function () {
            (window._jvQueue || []).forEach(function (fn) { fn(); });
            window._jvQueue = [];
          });
        };
        document.head.appendChild(s);
      }
    }
  });
})();
</script>
